<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Nord-themed Rime icon — filled "中" character for tray visibility -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <rect x="1" y="1" width="46" height="46" rx="10" fill="#eceff4" stroke="#2e3440" stroke-width="2"/>
  <!-- 中 character — filled paths for visibility at small sizes -->
  <g fill="#2e3440">
    <!-- 丨 (vertical stroke) — thick -->
    <rect x="21.5" y="4" width="5" height="40" rx="2.5"/>
    <!-- 口 (outer box) — as 4 filled bars -->
    <rect x="12" y="14" width="24" height="4" rx="2"/>
    <rect x="12" y="14" width="4" height="22" rx="2"/>
    <rect x="32" y="14" width="4" height="22" rx="2"/>
    <rect x="12" y="32" width="24" height="4" rx="2"/>
  </g>
</svg>
