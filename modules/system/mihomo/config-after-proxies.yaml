# Subscription nodes come from the `glados` proxy-provider in the encrypted
# fragment and are picked by the provider's `<region>-<tag>-<n>` names, the
# same scheme the subscription's own groups are built on, so plan changes
# that re-address nodes need no edit here:
#   Fixed          static exit IP per region (US, TW, JP)
#   Fast/Balancer  cross-region clusters (no geo tag, exit country varies)
#   X<n>           n-times traffic billing: X1 is the normal rate; the
#                  JP-Express-X5 nodes are only offered to Google and
#                  Anna's Archive
# A filter that stops matching after an upstream rename leaves its group
# with only COMPATIBLE, which dials DIRECT; check the group list in the
# dashboard after the subscription changes its node names.
# `filter` only applies to `use:` members; the static `proxies:` entries
# (groups, the self-hosted IN-NexIP nodes, DIRECT) always come first.
proxy-groups:
- name: Default Proxy
  type: select
  proxies:
  - Auto
  - Express
  - TW Fixed IP
  - US Fixed IP
  - JP Fixed IP
  - IN-NexIP-Sticky
  - IN-NexIP-Rotating
  - DIRECT
  use:
  - glados
  filter: -Fixed-|^(Fast|Balancer)-
- name: Research + AI
  type: select
  proxies:
  - US Fixed IP
  - TW Fixed IP
  - JP Fixed IP
  - IN-NexIP-Sticky
  - IN-NexIP-Rotating
  use:
  - glados
  filter: -Fixed-
- name: Grok
  type: select
  proxies:
  - TW Fixed IP
  use:
  - glados
  filter: ^TW-Fixed-
# One group for every Google-account domain: Google binds session tokens to
# the client IP, so splitting accounts.google.com and the Gemini/Antigravity
# APIs across exits fails with "<ip> != <ip>". US first because Antigravity
# needs a US exit; the JP and TW exits now geolocate correctly for Gemini.
- name: Google
  type: select
  proxies:
  - US Fixed IP
  - JP Fixed IP
  - TW Fixed IP
  use:
  - glados
  filter: -Fixed-|^JP-Express-X5-
# The subscription no longer tags Netflix-unlock nodes.
- name: Streaming
  type: select
  proxies:
  - Express
  - Download
  use:
  - glados
  filter: -Fixed-|^Balancer-
# Deezer's search API answers with empty results from exits outside its
# markets (TW, HK, CN, and DIRECT all return nothing); album lookups work
# anywhere. The US/JP exits get full search results, which beets needs when
# a download carries no UPC.
- name: Deezer
  type: select
  proxies:
  - US Fixed IP
  - JP Fixed IP
  use:
  - glados
  filter: ^(US|JP)-Fixed-
# DDoS-Guard sends every Anna's Archive search through its JS check, and
# rejects that check (the /mark/ POST returns 503, then the manual captcha)
# from every Fixed/Fast/Balancer/X1 exit; tested 2026-10-30 with a fresh
# browser per exit. The JP-Express-X5 exits are AWS Tokyo addresses and pass.
# check.ddos-guard.net does not need to share the exit, so it stays on the
# MATCH rule. Only page loads go here; file downloads use partner domains.
- name: Anna's Archive
  type: select
  proxies:
  - JP Express
  - Default Proxy
- name: Developer
  type: select
  proxies:
  - US Fixed IP
  - TW Fixed IP
  - IN-NexIP-Sticky
  - IN-NexIP-Rotating
  use:
  - glados
  filter: -Fixed-|^Fast-
- name: Download
  type: select
  proxies:
  - Download-Auto
  - Auto
  - Default Proxy
  - US Fixed IP
  - DIRECT
  use:
  - glados
  filter: ^(Fast|US-X1)-|-Fixed-
- name: Steam
  type: select
  proxies:
  - US
  - DIRECT
  - Download
  use:
  - glados
  filter: ^US-X1-
- name: Premium
  type: select
  proxies:
  - Express
  - US Fixed IP
  use:
  - glados
  filter: -Fixed-
- name: Apple
  type: select
  proxies:
  - DIRECT
  use:
  - glados
  filter: ^US-X1-
- name: Microsoft
  type: select
  proxies:
  - DIRECT
  use:
  - glados
  filter: ^US-X1-
# Probe over HTTPS: unified-delay sends two requests, and nodes that hijack
# plain HTTP fail the second HEAD ("failed to get the second response"),
# marking a working node dead.
- name: Auto
  type: url-test
  hidden: true
  use:
  - glados
  filter: ^(Fast|Balancer)-
  url: https://www.gstatic.com/generate_204
  tolerance: 100
- name: Express
  type: url-test
  hidden: true
  use:
  - glados
  filter: ^(Balancer|US-X1)-|-Fixed-
  url: https://www.gstatic.com/generate_204
  tolerance: 100
# A group's `url` on provider nodes is only registered as an extra URL on the
# provider's health check; interval, timeout and lazy come from the provider,
# so these groups set no interval. Keep a separate provider for fixed-IP
# groups so its own check probes Google over TLS every 120s: some shared exits
# answer plain HTTP but reset TLS to Google.
- name: US Fixed IP
  type: fallback
  hidden: true
  use:
  - glados-fixed-ip
  filter: ^US-Fixed-
  url: https://www.google.com/generate_204
- name: TW Fixed IP
  type: fallback
  hidden: true
  use:
  - glados-fixed-ip
  filter: ^TW-Fixed-
  url: https://www.google.com/generate_204
- name: JP Fixed IP
  type: fallback
  hidden: true
  use:
  - glados-fixed-ip
  filter: ^JP-Fixed-
  url: https://www.google.com/generate_204
- name: US
  type: url-test
  hidden: true
  use:
  - glados
  filter: ^US-X1-
  url: https://www.gstatic.com/generate_204
- name: JP Express
  type: url-test
  hidden: true
  use:
  - glados
  filter: ^JP-Express-X5-
  url: https://www.gstatic.com/generate_204
  tolerance: 100
# The subscription's own Download group uses the normal-rate US-X1 nodes.
- name: Download-Auto
  type: fallback
  hidden: true
  proxies:
  - US
  - Auto
  url: https://www.gstatic.com/generate_204
  interval: 180
# Same ad blocking as the phone's Box config; switch to DIRECT in the
# dashboard when a site breaks.
- name: Ad Block
  type: select
  proxies:
  - REJECT
  - DIRECT
sub-rules: null
listeners: null
hosts: {}
dns:
  enable: true
  prefer-h3: false
  ipv6: true
  ipv6-timeout: 100
  use-hosts: true
  use-system-hosts: true
  # Foreign lookups follow proxy rules / #Default Proxy. CN policy stays DIRECT.
  respect-rules: true
  # Nameservers are queried in parallel. The second rides Auto so DNS
  # survives a Default Proxy selection that dials DIRECT: on 2026-10-23 a
  # node rename emptied the selected TW Fixed IP, both resolvers timed out
  # direct, and every foreign lookup failed.
  nameserver:
  - "https://1.1.1.1/dns-query#Default Proxy"
  - "https://8.8.8.8/dns-query#Auto"
  fallback: null
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr: []
    domain: null
    geosite: []
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: ''
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - router.miwifi.com
  - miwifi.com
  - +.docker.io
  - +.market.xiaomi.com
  - +.push.apple.com
  fake-ip-filter-mode: blacklist
  fake-ip-ttl: 1
  default-nameserver:
  - 223.5.5.5
  - 114.114.114.114
  cache-algorithm: ''
  cache-max-size: 0
  nameserver-policy:
    "geosite:private":
      - system://
      - 223.5.5.5
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - 223.5.5.5
      - 114.114.114.114
  # DoH by IP: some upstreams (e.g. a phone hotspot running its own fake-ip
  # proxy) hijack plain UDP/53 and hand back 198.18.x for node domains, so the
  # nodes get double-proxied and dials time out.
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  direct-nameserver: null
  direct-nameserver-follow-policy: false
tun:
  enable: true
  device: mihomo
  stack: mixed
  dns-hijack:
  - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  inet6-address:
  - fdfe:dcba:9876::1/126
  file-descriptor: 0
  recvmsgx: true
  route-address: []
profile:
  store-selected: true
  store-fake-ip: false
geox-url:
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
sniffer:
  enable: false
rule-providers:
  awavenue-ads:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml
    path: ./rule_provider/awavenue-ads.yaml
    interval: 86400
    proxy: Default Proxy
