sub-rules: null
listeners: null
hosts: {}
dns:
  enable: true
  prefer-h3: false
  ipv6: true
  ipv6-timeout: 100
  use-hosts: true
  use-system-hosts: true
  # Foreign lookups follow proxy rules / #Default Proxy. CN policy stays DIRECT.
  respect-rules: true
  nameserver:
  - "https://1.1.1.1/dns-query#Default Proxy"
  - "https://8.8.8.8/dns-query#Default Proxy"
  fallback: null
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr: []
    domain: null
    geosite: []
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: ''
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - router.miwifi.com
  - miwifi.com
  - +.docker.io
  - +.market.xiaomi.com
  - +.push.apple.com
  fake-ip-filter-mode: blacklist
  fake-ip-ttl: 1
  default-nameserver:
  - 223.5.5.5
  - 114.114.114.114
  cache-algorithm: ''
  cache-max-size: 0
  nameserver-policy:
    "geosite:private":
      - system://
      - 223.5.5.5
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - 223.5.5.5
      - 114.114.114.114
  proxy-server-nameserver:
  - 223.5.5.5
  - 114.114.114.114
  direct-nameserver: null
  direct-nameserver-follow-policy: false
tun:
  enable: true
  device: mihomo
  stack: mixed
  dns-hijack:
  - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  inet6-address:
  - fdfe:dcba:9876::1/126
  file-descriptor: 0
  recvmsgx: true
  route-address: []
profile:
  store-selected: true
  store-fake-ip: false
geox-url:
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
sniffer:
  enable: false
