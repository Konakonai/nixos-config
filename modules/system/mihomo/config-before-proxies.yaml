port: 0
socks-port: 0
redir-port: 0
tproxy-port: 0
mixed-port: 7890
authentication: []
skip-auth-prefixes: null
bind-address: '*'
allow-lan: true
mode: rule
unified-delay: true
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090
external-controller-cors:
  allow-origins:
  - '*'
  allow-private-network: true
secret: ''
routing-mark: 162
tcp-concurrent: true
find-process-mode: 'off'
keep-alive-interval: 30
